name: Deploy to VPS

# Trigger: setiap push ke branch main
on:
  push:
    branches: [main]
  workflow_dispatch:   # tombol "Run workflow" manual di GitHub

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH ke VPS dan deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script: |
            set -e
            cd /var/www/seaipc2026

            echo "==> Pull terbaru"
            git pull origin main

            echo "==> Backend: install deps & restart"
            cd backend
            source venv/bin/activate
            pip install -r requirements.txt
            pm2 restart seaipc-backend || pm2 start "uvicorn server:app --host 127.0.0.1 --port 8001" --name seaipc-backend --interpreter none
            deactivate

            echo "==> Frontend: rebuild"
            cd ../frontend
            yarn install --frozen-lockfile
            yarn build

            echo "==> Deploy selesai ✓"
